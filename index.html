<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="StudyFlow 个人学习进度管理"><title>StudyFlow · 学习管理</title>
<style>
:root{--ink:#182238;--muted:#69758b;--line:#e5e9f1;--bg:#f6f8fc;--card:#fff;--primary:#6474f5;--danger:#d94b63;--shadow:0 14px 35px #26365d12}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}button,input{font:inherit}button{cursor:pointer}.shell{max-width:1120px;margin:auto;padding:34px 22px 56px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px}.brand{display:flex;align-items:center;gap:13px}.mark{display:grid;place-items:center;width:43px;height:43px;border-radius:13px;background:linear-gradient(135deg,#6475f5,#8b79f2);color:#fff;font-size:20px;font-weight:800;box-shadow:0 8px 18px #6475f540}h1,h2,p{margin:0}h1{font-size:24px;letter-spacing:-.03em}.sub{margin-top:3px;color:var(--muted);font-size:13px}.view[hidden]{display:none!important}.home-head{display:flex;justify-content:space-between;align-items:end;margin-bottom:18px}.home-head h2{font-size:22px}.home-head p{margin-top:4px;color:var(--muted)}.primary{border:0;border-radius:10px;background:var(--primary);color:#fff;padding:10px 15px;font-weight:700}.primary:hover{filter:brightness(.95)}.project-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:15px}.project-card,.detail-card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}.project-card{position:relative;padding:20px;transition:transform .18s,box-shadow .18s}.project-card:hover{transform:translateY(-2px);box-shadow:0 18px 40px #26365d18}.card-top{display:flex;justify-content:space-between;gap:10px}.project-card h3{font-size:17px}.project-card .meta{margin-top:3px;color:var(--muted);font-size:12px}.theme-dot{width:12px;height:12px;border-radius:50%;background:var(--project-color);flex:none;margin-top:5px}.segments{display:grid;grid-template-columns:repeat(var(--segment-count),minmax(0,1fr));gap:3px;margin-top:17px}.segment{height:12px;min-width:2px;border-radius:4px;background:#edf0f4}.segment.done{background:var(--project-color)}.segment-legend{display:flex;justify-content:space-between;margin-top:9px;color:var(--muted);font-size:12px}.empty{padding:50px;text-align:center;background:var(--card);border:1px dashed #cfd5e2;border-radius:18px;color:var(--muted)}.detail-card{padding:24px}.detail-head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px}.back{border:0;background:transparent;color:var(--primary);padding:6px 0;font-weight:700}.detail-title{display:flex;align-items:center;gap:9px}.detail-title h2{font-size:24px}.detail-meta{margin-top:5px;color:var(--muted)}.detail-actions{display:flex;gap:9px;align-items:center}.color-label{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12px}.color-input{width:34px;height:30px;border:1px solid var(--line);border-radius:7px;padding:2px;background:#fff}.danger{border:0;border-radius:9px;padding:8px 11px;background:#fff0f3;color:var(--danger);font-size:13px}.grid-title{display:flex;justify-content:space-between;align-items:center;margin:25px 0 14px}.grid-title h3{font-size:16px}.grid-title span{color:var(--muted);font-size:12px}.page-grid{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:7px}.page-cell{aspect-ratio:1;border:1px solid #e1e6ee;border-radius:8px;background:#eef1f5;color:#778196;font-weight:650;transition:.15s}.page-cell:hover{transform:translateY(-2px);box-shadow:0 5px 12px #26365d1a}.page-cell.done{border-color:var(--project-color);background:var(--project-color);color:#fff}.modal{width:min(420px,calc(100% - 30px));padding:24px;border:0;border-radius:17px;color:var(--ink);box-shadow:0 24px 70px #141d373d}.modal::backdrop{background:#131c3370}.modal h2{font-size:19px}.modal p{margin-top:6px;color:var(--muted);font-size:13px}.field{margin-top:17px}.field label{display:block;margin-bottom:6px;font-size:13px;font-weight:700}.field input:not([type=color]){width:100%;padding:10px 11px;border:1px solid #d8deea;border-radius:9px;outline:0}.field input:focus{border-color:var(--primary);box-shadow:0 0 0 3px #6475f522}.modal-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:22px}.cancel{border:0;border-radius:9px;padding:10px 15px;background:#eef1f5;color:var(--muted)}@media(max-width:650px){.shell{padding:22px 14px 40px}.top{margin-bottom:21px}.home-head{align-items:flex-start;gap:12px;flex-direction:column}.home-head h2{font-size:20px}.project-cards{grid-template-columns:1fr}.detail-card{padding:18px 15px}.detail-head{display:block}.detail-actions{margin-top:14px;justify-content:space-between}.detail-title h2{font-size:21px}.page-grid{gap:5px}.page-cell{border-radius:6px;font-size:11px}.segments{gap:2px}}
</style>
</head>
<body><main class="shell"><header class="top"><div class="brand"><div class="mark" aria-hidden="true">S</div><div><h1>StudyFlow</h1><p class="sub">让每一次努力，都看得见。</p></div></div><button class="primary" id="headerAdd" type="button">＋ 新增项目</button></header>
<section id="homeView" class="view"><div class="home-head"><div><h2>我的学习项目</h2><p>每一格都代表真实的一页，按自己的节奏前进。</p></div></div><div id="projectCards" class="project-cards"></div></section>
<section id="detailView" class="view" hidden><div class="detail-card" id="detailContent"></div></section></main>
<dialog id="addDialog" class="modal"><form id="addForm" method="dialog"><h2>新增学习项目</h2><p>设置项目名称、总页数和主题颜色。</p><div class="field"><label for="nameInput">项目名称</label><input id="nameInput" maxlength="40" required placeholder="例如：英语单词"/></div><div class="field"><label for="totalInput">总页数</label><input id="totalInput" type="number" min="1" max="1000" value="100" required/></div><div class="field"><label for="themeInput">主题颜色</label><input id="themeInput" class="color-input" type="color" value="#6474f5"/></div><div class="modal-actions"><button class="cancel" id="cancelAdd" type="button">取消</button><button class="primary" type="submit">创建项目</button></div></form></dialog>
<script>
const STORAGE_KEY='studyflow-projects-v1';
const DEFAULT_THEME='#6474f5';
const homeView=document.getElementById('homeView'),detailView=document.getElementById('detailView'),cards=document.getElementById('projectCards'),detail=document.getElementById('detailContent'),dialog=document.getElementById('addDialog'),form=document.getElementById('addForm'),nameInput=document.getElementById('nameInput'),totalInput=document.getElementById('totalInput'),themeInput=document.getElementById('themeInput');
let projects=loadProjects(), activeId=null;
function makeProject(name,total,theme=DEFAULT_THEME){return{id:Date.now().toString(36)+Math.random().toString(36).slice(2,7),name,total,completed:[],theme};}
function safeTheme(value){return /^#[0-9a-fA-F]{6}$/.test(value)?value:DEFAULT_THEME}
function loadProjects(){try{const saved=JSON.parse(localStorage.getItem(STORAGE_KEY));if(Array.isArray(saved)&&saved.length)return saved.map(p=>({...p,total:Number.isInteger(p.total)&&p.total>0?p.total:1,completed:Array.isArray(p.completed)?[...new Set(p.completed.filter(n=>Number.isInteger(n)&&n>0))].sort((a,b)=>a-b):[],theme:safeTheme(p.theme)}));}catch(error){console.warn('无法读取学习记录',error)}const initial=makeProject('C++ 练习册',100);localStorage.setItem(STORAGE_KEY,JSON.stringify([initial]));return[initial]}
function save(){localStorage.setItem(STORAGE_KEY,JSON.stringify(projects))}function esc(value){return String(value).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}function percent(p){return p.total?Math.round(p.completed.length/p.total*100):0}function segments(p){return Array.from({length:p.total},(_,i)=>{const page=i+1;return`<span class="segment${p.completed.includes(page)?' done':''}" title="第 ${page} 页${p.completed.includes(page)?'（已完成）':'（未完成）'}"></span>`}).join('')}
function renderHome(){homeView.hidden=false;detailView.hidden=true;if(!projects.length){cards.innerHTML='<div class="empty">还没有学习项目，点击右上角开始创建。</div>';return}cards.innerHTML=projects.map(p=>`<button class="project-card" type="button" data-open="${p.id}" style="--project-color:${esc(p.theme)}"><span class="card-top"><span><h3>${esc(p.name)}</h3><span class="meta">已完成 ${p.completed.length} / ${p.total} 页 · ${percent(p)}%</span></span><span class="theme-dot" aria-label="主题颜色"></span></span><span class="segments" style="--segment-count:${Math.min(p.total,100)}">${segments(p)}</span><span class="segment-legend"><span>逐页进度</span><span>${p.completed.length === p.total ? '全部完成' : '继续学习'}</span></span></button>`).join('')}
function renderDetail(){const p=projects.find(x=>x.id===activeId);if(!p){renderHome();return}homeView.hidden=true;detailView.hidden=false;detail.innerHTML=`<div class="detail-head"><div><button class="back" id="backHome" type="button">← 返回首页</button><div class="detail-title"><span class="theme-dot" style="--project-color:${esc(p.theme)}"></span><h2>${esc(p.name)}</h2></div><p class="detail-meta">已完成 ${p.completed.length} / ${p.total} 页 · 完成率 ${percent(p)}%</p></div><div class="detail-actions"><label class="color-label">主题色 <input class="color-input" id="detailTheme" type="color" value="${esc(p.theme)}"/></label><button class="danger" id="deleteProject" type="button">删除项目</button></div></div><div class="grid-title"><h3>全部页数</h3><span>点击格子切换完成状态</span></div><div class="page-grid" style="--project-color:${esc(p.theme)}">${Array.from({length:p.total},(_,i)=>{const page=i+1,done=p.completed.includes(page);return`<button class="page-cell${done?' done':''}" type="button" data-page="${page}" aria-label="第 ${page} 页，${done?'已完成':'未完成'}" aria-pressed="${done}">${page}</button>`}).join('')}</div>`}
function render(){save();activeId?renderDetail():renderHome()}
cards.addEventListener('click',e=>{const card=e.target.closest('[data-open]');if(card){activeId=card.dataset.open;render()}});detail.addEventListener('click',e=>{if(e.target.id==='backHome'){activeId=null;render()}if(e.target.id==='deleteProject'){const p=projects.find(x=>x.id===activeId);if(projects.length===1){alert('至少保留一个学习项目，暂时不能删除。');return}if(confirm(`确定要删除“${p.name}”吗？此项目的完成记录也会被删除。`)){projects=projects.filter(x=>x.id!==activeId);activeId=null;render()}}if(e.target.closest('[data-page]')){const page=Number(e.target.closest('[data-page]').dataset.page),p=projects.find(x=>x.id===activeId),i=p.completed.indexOf(page);i>=0?p.completed.splice(i,1):p.completed.push(page);p.completed.sort((a,b)=>a-b);render()}});detail.addEventListener('change',e=>{if(e.target.id==='detailTheme'){const p=projects.find(x=>x.id===activeId);p.theme=e.target.value;render()}});document.getElementById('headerAdd').addEventListener('click',()=>{form.reset();totalInput.value=100;themeInput.value=DEFAULT_THEME;dialog.showModal();nameInput.focus()});document.getElementById('cancelAdd').addEventListener('click',()=>dialog.close());form.addEventListener('submit',e=>{e.preventDefault();const name=nameInput.value.trim(),total=Number(totalInput.value);if(!name||!Number.isInteger(total)||total<1||total>1000)return;const p=makeProject(name,total,themeInput.value);projects.push(p);activeId=p.id;render();dialog.close()});render();
</script></body></html>
